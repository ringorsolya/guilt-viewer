name: Publish viewer

# Publishes this repository (viewer code only) to GitHub Pages.
# Refuses to publish if any data file has been added by mistake.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish data files
        run: |
          if find . -path ./.git -prune -o -type f \( -name '*.json*' -o -name '*.xlsx' -o -name '*.csv' -o -name '*.gz' -o -name '*.pkl' \) -print | grep -q .; then
            echo "::error::Data files found – this public repository must contain viewer code only"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
